<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>جرد نقيصة معمل قاسم العبسلي</title>
    
    <!-- PWA Primary Config -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C5A028" />
    
    <!-- iOS / Safari Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="نقيصة العبسلي" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    
    <!-- General Icon fallback -->
    <link rel="icon" type="image/png" href="/icon-512.png" />
  </head>
  <body class="bg-[#0a0a0a] text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then((registration) => {
              console.log("[PWA] Service Worker registered in scope:", registration.scope);
            })
            .catch((error) => {
              console.error("[PWA] Service Worker registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
